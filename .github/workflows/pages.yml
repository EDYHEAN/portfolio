# Le site est sur Vercel (johantrigeard.com). GitHub Pages ne sert plus qu'à rediriger l'ancienne adresse,
# en gardant le chemin de la page : la même page en index.html et en 404.html.
name: Pages
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - .github/redirect/**
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir _site
          cp .github/redirect/index.html _site/index.html
          cp .github/redirect/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
